<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>PDFo.io - Free Online PDF Tools | Merge, Split, Compress</title>
    <meta name="description" content="Free online PDF tools - Merge, Split, Compress, Convert PDFs. No signup required. Fast, secure, and easy to use.">
    <meta name="keywords" content="PDF tools, merge PDF, split PDF, compress PDF, PDF converter, online PDF editor">
    
    <!-- Open Graph -->
    <meta property="og:title" content="PDFo.io - Free Online PDF Tools">
    <meta property="og:description" content="Free online PDF tools - Merge, Split, Compress, Convert PDFs">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://pdfo.io/">
    <meta property="og:site_name" content="PDFo.io">
    <meta property="og:image" content="https://pdfo.io/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="PDFo.io - Free Online PDF Tools">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@pdfoio">
    <meta name="twitter:creator" content="@pdfoio">
    <meta name="twitter:title" content="PDFo.io - Free Online PDF Tools">
    <meta name="twitter:description" content="Free online PDF tools - Merge, Split, Compress, Convert PDFs">
    <meta name="twitter:image" content="https://pdfo.io/og-image.jpg">
    
    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    
    <!-- Fonts: system stack covers FCP instantly. Inter is preloaded below
         (with font-display: swap) so the heading swaps to brand type once
         the woff2 lands, without ever blocking LCP. JetBrains Mono is
         declared via @font-face in index.css and loads on demand. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="https://fonts.gstatic.com/s/inter/v18/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuLyfAZ9hiJ-Ek-_EeA.woff2"
      crossorigin
    >

    <!-- Preload the LCP hero background so the browser starts fetching it
         before the JS bundle parses. imagesrcset + imagesizes must mirror
         the <img>'s srcSet/sizes exactly, otherwise the browser preloads
         one variant and then renders a different one (wasted bytes +
         "preloaded but not used" console warning). -->
    <link
      rel="preload"
      as="image"
      href="/assets/hero_bg_1280.webp"
      imagesrcset="/assets/hero_bg_768.webp 768w, /assets/hero_bg_1280.webp 1280w, /assets/hero_bg_1768.webp 1768w"
      imagesizes="100vw"
      type="image/webp"
      fetchpriority="high"
    >
    
    <!-- Analytics -->
    <script async src="https://plausible.io/js/pa-zdPlswqHtQW8aiyX6hR6z.js"></script>
    <script>
      window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
      plausible.init()
    </script>
    
    <!-- Prevent theme flash -->
    <script>
      const theme = localStorage.getItem('theme');
      if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
